<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MİNE - Evrensel Sevgi Simülasyonu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #05020a;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Üstteki Pembe Neon Kart */
        .card-container {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            width: 90%;
            max-width: 440px;
            background: rgba(20, 5, 25, 0.75);
            border: 1.5px solid #ff2a8d;
            border-radius: 20px;
            padding: 18px 16px;
            text-align: center;
            box-shadow: 0 0 30px rgba(255, 42, 141, 0.45), inset 0 0 15px rgba(255, 42, 141, 0.25);
            backdrop-filter: blur(12px);
        }

        .card-container h1 {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #ffffff;
            text-shadow: 0 0 10px #ff2a8d, 0 0 20px #ff2a8d;
            margin-bottom: 6px;
        }

        .card-container p {
            font-size: 15px;
            font-weight: 500;
            color: #f3e5f5;
            line-height: 1.4;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
            min-height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Evrene Kalp Gönderme Butonu */
        .heart-btn {
            position: absolute;
            bottom: 35px;
            z-index: 10;
            background: linear-gradient(135deg, #ff2a8d, #9c27b0);
            border: none;
            color: white;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 42, 141, 0.6);
            transition: transform 0.2s, box-shadow 0.2s;
            outline: none;
            letter-spacing: 1px;
        }

        .heart-btn:active {
            transform: scale(0.92);
        }

        /* Arka Plan Uçuşan Kalpler */
        .heart-particle {
            position: absolute;
            color: #ff69b4;
            font-size: 14px;
            user-select: none;
            pointer-events: none;
            z-index: 2;
            opacity: 0.7;
            animation: floatUp 8s linear infinite;
        }

        /* Butondan Karadeliğe Fırlatılan Özel 3D Kalpler */
        .flying-heart {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            color: #ff2a8d;
            font-size: 24px;
            z-index: 15;
            pointer-events: none;
            animation: flyToUniverse 1.5s ease-out forwards;
        }

        @keyframes floatUp {
            0% { transform: translateY(105vh) scale(0.5); opacity: 0; }
            20% { opacity: 0.8; }
            80% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }

        @keyframes flyToUniverse {
            0% {
                transform: translate(-50%, 0) scale(0.5);
                opacity: 1;
            }
            100% {
                transform: translate(calc(-50% + (var(--rand-x) * 50px)), -55vh) scale(2.2);
                opacity: 0;
            }
        }
    </style>
    <!-- Three.js Kütüphanesi -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <!-- Arka Plan Uçuşan Kalpler -->
    <div id="hearts-bg"></div>

    <!-- 3D Karadelik ve Kayan Yıldızlar -->
    <div id="canvas-container"></div>

    <!-- Üst Bilgi ve Evren Şans Kartı -->
    <div class="card-container">
        <h1>MİNE</h1>
        <p id="universe-message">Çekim kuvvetine kapıldığım tek evrensin... ✨</p>
    </div>

    <!-- Evrene Kalp Gönder Butonu -->
    <button class="heart-btn" onclick="sendHeartToUniverse()">🌌 Evrene Kalp Gönder</button>

    <script>
        // Paralel Evren ve Şans Mesajları
        const multiverses = [
            "Çekim kuvvetine kapıldığım tek evrensin... ✨",
            "[Evren #042]: Milyarlarca ihtimal arasından seni bulmuş olmam en büyük şansım.",
            "[Evren #108]: Yıldızlar sönse bile sana olan sevgim parlamaya devam edecek.",
            "[Evren #314]: Zamanı geriye sarsalar da yine sadece seni seçerdim.",
            "[Evren #777]: Sonsuz ihtimal ve şans evreninde kalbim sadece senin için atıyor.",
            ">>> HER EVRENDE, HER İHTİMALDE SENİ ÇOK SEVİYORUM MİNE! ❤️ <<<"
        ];

        let msgIdx = 0;
        const msgElement = document.getElementById("universe-message");

        function rotateMessages() {
            msgIdx = (msgIdx + 1) % multiverses.length;
            msgElement.style.opacity = 0;
            setTimeout(() => {
                msgElement.innerHTML = multiverses[msgIdx];
                msgElement.style.opacity = 1;
            }, 300);
        }
        setInterval(rotateMessages, 4000);
        msgElement.style.transition = "opacity 0.3s ease-in-out";

        // Butona Basınca Evrene Kalp Fırlatma Efekti
        function sendHeartToUniverse() {
            const heart = document.createElement('div');
            heart.className = 'flying-heart';
            heart.innerHTML = '💖';
            heart.style.setProperty('--rand-x', (Math.random() - 0.5) * 4);
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 1500);
        }

        // Arka Plan Kalpleri
        const heartsBg = document.getElementById('hearts-bg');
        for (let i = 0; i < 40; i++) {
            const heart = document.createElement('div');
            heart.className = 'heart-particle';
            heart.innerHTML = '♥';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDelay = (Math.random() * 8) + 's';
            heart.style.animationDuration = (6 + Math.random() * 6) + 's';
            heart.style.fontSize = (10 + Math.random() * 12) + 'px';
            heartsBg.appendChild(heart);
        }

        // THREE.JS 3D Sahne Kurulumu
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2.2, 4.5);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // Karadelik Çekirdeği
        const holeGeo = new THREE.SphereGeometry(0.55, 64, 64);
        const holeMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
        const blackHole = new THREE.Mesh(holeGeo, holeMat);
        scene.add(blackHole);

        // İç Işık Halkası
        const innerRingGeo = new THREE.RingGeometry(0.56, 0.68, 64);
        const innerRingMat = new THREE.MeshBasicMaterial({ 
            color: 0xffffff, 
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.95
        });
        const innerRing = new THREE.Mesh(innerRingGeo, innerRingMat);
        innerRing.rotation.x = Math.PI / 2;
        scene.add(innerRing);

        // Akresyon Diski (Dönen Parçacıklar)
        const particleCount = 14000;
        const diskGeo = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);

        const colorInner = new THREE.Color(0xff0080);
        const colorOuter = new THREE.Color(0x6a00ff);

        for (let i = 0; i < particleCount; i++) {
            const r = 0.65 + Math.pow(Math.random(), 1.8) * 2.8;
            const theta = Math.random() * Math.PI * 2;

            const x = Math.cos(theta) * r;
            const y = (Math.random() - 0.5) * 0.08 * (r * 0.5);
            const z = Math.sin(theta) * r;

            positions[i * 3] = x;
            positions[i * 3 + 1] = y;
            positions[i * 3 + 2] = z;

            const mixRatio = (r - 0.65) / 2.8;
            const c = colorInner.clone().lerp(colorOuter, mixRatio);

            colors[i * 3] = c.r;
            colors[i * 3 + 1] = c.g;
            colors[i * 3 + 2] = c.b;
        }

        diskGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        diskGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const diskMat = new THREE.PointsMaterial({
            size: 0.022,
            vertexColors: true,
            transparent: true,
            opacity: 0.85,
            blending: THREE.AdditiveBlending
        });

        const accretionDisk = new THREE.Points(diskGeo, diskMat);
        scene.add(accretionDisk);

        // Karadelik Üstündeki "✨ MİNE ✨" Yazısı
        const canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 128;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.font = 'Bold 48px sans-serif';
        ctx.textAlign = 'center';
        ctx.shadowColor = '#ff0080';
        ctx.shadowBlur = 15;
        ctx.fillText('✨ MİNE ✨', 256, 70);

        const textTexture = new THREE.CanvasTexture(canvas);
        const textSpriteMat = new THREE.SpriteMaterial({ map: textTexture, transparent: true });
        const textSprite = new THREE.Sprite(textSpriteMat);
        textSprite.position.set(0, 0.85, 0);
        textSprite.scale.set(1.8, 0.45, 1);
        scene.add(textSprite);

        // Kayan Yıldız Çizgileri
        const streakCount = 25;
        const streakLines = [];

        for (let i = 0; i < streakCount; i++) {
            const lineGeo = new THREE.BufferGeometry();
            const points = [
                new THREE.Vector3(0, 0, 0),
                new THREE.Vector3(-0.15, -0.4, -0.15)
            ];
            lineGeo.setFromPoints(points);

            const lineMat = new THREE.LineBasicMaterial({
                color: 0xffb6c1,
                transparent: true,
                opacity: Math.random() * 0.7 + 0.3
            });

            const line = new THREE.Line(lineGeo, lineMat);
            line.position.set(
                (Math.random() - 0.5) * 8,
                Math.random() * 5 + 1,
                (Math.random() - 0.5) * 6
            );
            scene.add(line);
            streakLines.push({ mesh: line, speed: Math.random() * 0.06 + 0.03 });
        }

        // Animasyon Döngüsü
        function animate() {
            requestAnimationFrame(animate);

            accretionDisk.rotation.y -= 0.008;

            streakLines.forEach(streak => {
                streak.mesh.position.x -= streak.speed * 0.4;
                streak.mesh.position.y -= streak.speed;
                if (streak.mesh.position.y < -2) {
                    streak.mesh.position.y = Math.random() * 4 + 3;
                    streak.mesh.position.x = (Math.random() - 0.5) * 8;
                }
            });

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
